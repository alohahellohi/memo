const gallery = document.getElementById('gallery');
const viewer = document.getElementById('image-viewer');
const preview = document.getElementById('image-preview');
document.getElementById('image-close').addEventListener('click', () => viewer.close());
viewer.addEventListener('click', event => { if (event.target === viewer) viewer.close(); });
function appendSummary(section, topic) {
  if (typeof topic.summary !== 'string' || !topic.summary.trim()) return;
  const card = document.createElement('div');
  card.className = 'topic-summary';
  const content = document.createElement('div');
  content.className = 'text-content collapsed';
  content.textContent = topic.summary;
  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'toggle-text';
  toggle.textContent = '展開全文 ▼';
  toggle.setAttribute('aria-expanded', 'false');
  toggle.hidden = true;
  toggle.addEventListener('click', () => {
    const expanded = !content.classList.toggle('collapsed');
    toggle.textContent = expanded ? '收合內容 ▲' : '展開全文 ▼';
    toggle.setAttribute('aria-expanded', String(expanded));
  });
  card.append(content, toggle);
  section.append(card);
  function updateToggle() {
    if (content.classList.contains('collapsed')) {
      toggle.hidden = content.scrollHeight <= content.clientHeight + 2;
    }
  }
  requestAnimationFrame(updateToggle);
  window.addEventListener('resize', updateToggle);
}
function appendSource(section, topic) {
  if (!topic.source) return;
  const source = document.createElement('div');
  source.className = 'source';
  if (Array.isArray(topic.source)) {
    if (!topic.source.length) return;
    source.append(document.createTextNode('資料來源：'));
    for (const item of topic.source) {
      source.append(document.createTextNode('\n'));
      if (item.url && /^https?:\/\//i.test(item.url)) {
        const link = document.createElement('a');
        link.href = item.url;
        link.textContent = item.text || item.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        source.append(link);
      } else {
        source.append(document.createTextNode(item.text || ''));
      }
    }
    section.append(source);
    return;
  }
  const value = '資料來源：' + topic.source;
  const pattern = /https?:\/\/[^\s<>"'，。；、）】]+/gi;
  let last = 0;
  for (const match of value.matchAll(pattern)) {
    source.append(document.createTextNode(value.slice(last, match.index)));
    const link = document.createElement('a');
    link.href = match[0];
    link.textContent = match[0];
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.append(link);
    last = match.index + match[0].length;
  }
  source.append(document.createTextNode(value.slice(last)));
  section.append(source);
}
for (const topic of topics) {
  const section = document.createElement('section');
  const title = document.createElement('h2');
  title.textContent = topic.title;
  section.append(title);

  if (topic.type === 'text') {
    const card = document.createElement('article');
    card.className = 'text-card';
    const content = document.createElement('div');
    content.className = 'text-content collapsed';
    content.textContent = topic.content || '';
    card.append(content);
    const toggle = document.createElement('button');
    toggle.className = 'toggle-text';
    toggle.type = 'button';
    toggle.textContent = '展開全文 ▼';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.addEventListener('click', () => {
      const expanded = content.classList.toggle('collapsed') === false;
      toggle.textContent = expanded ? '收合內容 ▲' : '展開全文 ▼';
      toggle.setAttribute('aria-expanded', String(expanded));
    });
    card.append(toggle);
    section.append(card);
    appendSource(section, topic);
    gallery.append(section);
    // Only show the toggle if text actually overflows four lines.
    requestAnimationFrame(() => {
      toggle.hidden = content.scrollHeight <= content.clientHeight + 2;
    });
    continue;
  }

  if (!Array.isArray(topic.videos)) continue;
  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = '← 左右滑動，查看更多影片 →';
  section.append(hint);
  const scroller = document.createElement('div');
  scroller.className = 'scroller';
  for (const item of topic.videos) {
    const card = document.createElement('article');
    card.className = 'video-card';
    const frame = document.createElement('div');
    frame.className = 'video-frame';
    const yt = item.url.match(/^https?:\/\/(?:(?:www\.|m\.)?youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([\w-]{11})(?=$|[?&#/])/i);
    if (item.type === 'image' || /\.(jpe?g|png|webp|gif|avif|bmp|svg)(?:[?#].*)?$/i.test(item.url)) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'image-button';
      button.setAttribute('aria-label', '放大圖片：' + (item.description || '圖片'));
      const img = document.createElement('img');
      img.src = item.url;
      img.alt = item.description || '圖片';
      img.loading = 'lazy';
      button.append(img);
      button.addEventListener('click', () => {
        preview.src = item.url;
        preview.alt = img.alt;
        viewer.showModal();
      });
      frame.append(button);
    } else if (yt) {
      const iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube-nocookie.com/embed/' + yt[1];
      iframe.title = item.description || 'YouTube';
      iframe.loading = 'lazy';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      frame.append(iframe);
    } else if (/\.(mp4|webm|ogg)(?:[?#].*)?$/i.test(item.url)) {
      const video = document.createElement('video');
      video.src = item.url;
      video.controls = true;
      video.preload = 'metadata';
      video.playsInline = true;
      video.setAttribute('aria-label', item.description || '影片');
      frame.append(video);
    } else {
      const note = document.createElement('p');
      note.textContent = '請確認影片或圖片路徑與格式';
      note.style = 'color:white;padding:20px';
      frame.append(note);
    }
    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = item.description || '';
    card.append(frame, desc);
    scroller.append(card);
  }
  section.append(scroller);
  appendSummary(section, topic);
  appendSource(section, topic);
  gallery.append(section);
}
</script>
